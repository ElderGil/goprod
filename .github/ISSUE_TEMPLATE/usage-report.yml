name: Usage report
description: Share how goprod worked on a real project (generated by the usage-report skill).
title: "Usage report: <stack>, <date>"
labels: ["usage-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing goprod. The easiest path: say "start goprod usage log" at the
        beginning of a session and "write the goprod usage report" at the end, then paste
        the sanitized report below. **This issue is public:** make sure it has no company
        names, customer data, secrets, internal hosts, or private paths.
  - type: input
    id: version
    attributes:
      label: goprod version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agent, model, and OS
      placeholder: "Claude Code / <model> / Windows 11 (Git Bash)"
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Project stack and risk tier
      placeholder: "Next.js + Postgres, T2"
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Paste the sanitized report (.goprod/usage-report-YYYY-MM-DD.md).
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: sanitized
    attributes:
      label: Confidentiality
      options:
        - label: I checked the report has no confidential information.
          required: true
